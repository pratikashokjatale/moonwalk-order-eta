name: Deploy Backend to GCP VM

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: ./mvnw clean package -DskipTests

    - name: Copy JAR to GCP VM
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.GCP_VM_IP }}
        username: ${{ secrets.GCP_SSH_USERNAME }}
        key: ${{ secrets.GCP_SSH_KEY }}
        source: "target/order-eta-0.0.1-SNAPSHOT.jar"
        target: "~/moonwalk-backend"
        strip_components: 1

    - name: Restart Backend Service
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.GCP_VM_IP }}
        username: ${{ secrets.GCP_SSH_USERNAME }}
        key: ${{ secrets.GCP_SSH_KEY }}
        script: |
          cd ~/moonwalk-backend
          # Kill existing java process running the jar
          pkill -f "order-eta-0.0.1-SNAPSHOT.jar" || true
          
          # Load environment variables if an .env file exists on the server
          if [ -f .env ]; then
            export $(cat .env | xargs)
          fi
          
          # Start the new jar in the background (uses application-prod.properties if present)
          nohup java -jar order-eta-0.0.1-SNAPSHOT.jar --spring.profiles.active=prod > backend.log 2>&1 &
          
          echo "Deployment successful! Spring Boot is starting."
